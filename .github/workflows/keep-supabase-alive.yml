name: Keep Supabase projects active

on:
  schedule:
    - cron: '0 14 * * *'   # daily at 14:00 UTC (7am PDT)
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping RAG Document Q&A (ipkxvvfbvftduyrtlzst)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ipkxvvfbvftduyrtlzst.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_RAG_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_RAG_ANON_KEY }}")
          echo "RAG Document Q&A → HTTP $STATUS"
          [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ] || exit 1

      - name: Ping Job Application Tracker (qtxbctkuoqwfwcpyjxrl)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://qtxbctkuoqwfwcpyjxrl.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_JOB_TRACKER_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_JOB_TRACKER_ANON_KEY }}")
          echo "Job Application Tracker → HTTP $STATUS"
          [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ] || exit 1
