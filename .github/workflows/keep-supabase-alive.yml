name: Keep Supabase projects active

# RAG Document Q&A no longer uses Supabase (migrated to Neon + Clerk).
# This cron now only keeps the Job Application Tracker project warm.

on:
  schedule:
    - cron: '0 14 * * *'   # daily at 14:00 UTC (7am PDT)
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Job Application Tracker (qtxbctkuoqwfwcpyjxrl)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            "https://qtxbctkuoqwfwcpyjxrl.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_JOB_TRACKER_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_JOB_TRACKER_ANON_KEY }}" || true)
          echo "Job Application Tracker → HTTP $STATUS"
          # Any HTTP response (even 4xx) means the project is alive and not paused.
          # `|| true` above keeps a DNS/connection failure from short-circuiting
          # this script before the guard runs.
          [ "$STATUS" -ge 200 ] 2>/dev/null || { echo "Project unreachable (paused/deleted)"; exit 1; }
